name: ci
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  rust:
    name: 01-rust-workspace
    runs-on: depot-ubuntu-latest-4
    steps:
      - uses: actions/checkout@v4
      - name: Setup Depot
        uses: depot/setup-action@v1
      - name: Install sccache
        run: sudo apt-get update && sudo apt-get install -y sccache
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - name: Verify toolchain selection
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version
      - name: Run rustfmt
        run: cargo fmt --all --check
      - name: Run clippy
        run: depot cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
      - name: Run tests
        run: depot cargo test --workspace --locked
      - name: Build CLI entrypoints
        run: depot cargo build --workspace --locked
      - name: Exercise CLI and S3 behavior against local fixtures
        run: python3 scripts/test-runtime.py
