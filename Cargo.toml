[workspace]
members = [
  "apps/convex-inspect",
  "apps/convex-sync",
  "crates/convex-sync-core",
  "crates/convex-export-s3",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false
version = "0.0.3"

[workspace.dependencies]
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
aws-config = "1.12.0"
# Keep the supported HTTPS client without the legacy Hyper 0.14 / Rustls 0.21 client.
aws-sdk-s3 = { version = "1.152.0", default-features = false, features = ["default-https-client", "rt-tokio", "sigv4a", "http-1x"] }
clap = { version = "4.5.39", features = ["derive", "env"] }
dotenvy = "0.15.7"
hex = "0.4.3"
parquet = { version = "60.0.0", default-features = false, features = ["arrow"] }
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
url = { version = "2.5.4", features = ["serde"] }
walkdir = "2.5.0"
